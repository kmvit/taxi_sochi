server {
    listen 80;    
    listen 8080;
    server_name c28cb19bf49c.vps.myjino.ru;

    root /opt/taxi_sochi/frontend/build;
    index index.html;

    # Django Static Files для админки - должен быть ПЕРЕД общим блоком статики
    location /static/ {
        alias /opt/taxi_sochi/backend/staticfiles/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Django Admin - проксирование на backend
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service Worker - должен быть доступен напрямую
    location = /service-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Manifest - должен быть доступен напрямую  
    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
